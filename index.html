/* Layout: one 16:9 game canvas centered on black; touch buttons float over its corners on phones. Single dark arcade look by choice. */
:root{
  --void:#07060d;
  --ink:#f3f0ff;
  --gold:#ffd34d;
  --btn:rgba(20,18,36,.55);
  --btn-line:rgba(255,211,77,.45);
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;

html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{height:100%;display:flex;align-items:center;justify-content:center;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
canvas{display:block;outline:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none}
@media (pointer:coarse){body.ingame #touch{display:block}}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--void);color:var(--ink);text-align:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;font:700 16px var(--f-body)}
#rotate .ph{width:46px;height:78px;border:3px solid var(--gold);border-radius:9px;animation:rot 1.8s ease-in-out infinite}
#rotate small{font-weight:500;font-size:13px;opacity:.75;max-width:30ch}
#rotate button{margin-top:6px;background:var(--gold);color:#1b1424;border:0;border-radius:8px;padding:10px 18px;font:800 14px var(--f-body)}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#wrap{position:fixed;inset:0}
#wrap.rot{inset:auto;top:0;left:0;transform-origin:0 0}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(90deg)}}
#touch button{pointer-events:auto;position:absolute;opacity:.8;background:var(--btn);border:1.5px solid var(--btn-line);color:var(--ink);
  font:800 13px var(--f-body);border-radius:50%;width:62px;height:62px;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button.on{background:rgba(255,211,77,.35)}
#touch .l{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}

#touch .shoot{right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#touch .dash{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#touch .nova{right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));font-size:11px}

#touch .s1{right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#touch .s2{right:calc(98px + env(safe-area-inset-right,0px));bottom:calc(158px + env(safe-area-inset-bottom,0px))}
#touch .s3{right:calc(46px + env(safe-area-inset-right,0px));bottom:calc(166px + env(safe-area-inset-bottom,0px))}
#touch .guard{right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:12px}
#joy{position:absolute;left:0;top:28%;bottom:0;width:40%;pointer-events:auto;touch-action:none}
#joy .base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--btn-line);background:radial-gradient(circle,rgba(20,18,36,.15),rgba(20,18,36,.55));left:calc(84px + env(safe-area-inset-left,0px));top:calc(100% - 84px - env(safe-area-inset-bottom,0px));opacity:.75}
