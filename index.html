/* Layout: one 16:9 game canvas centered on black; touch buttons float over its corners on phones. Single dark arcade look by choice. */
:root{

html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage{height:100%;display:flex;align-items:center;justify-content:center;

canvas{display:block;outline:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none}

#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--void);color:var(--ink);text-align:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;font:700 16px var(--f-body)}
#rotate .ph{width:46px;height:78px;border:3px solid var(--gold);border-radius:9px;animation:rot 1.8s ease-in-out infinite}
#rotate small{font-weight:500;font-size:13px;opacity:.75;max-width:30ch}
#rotate button{margin-top:6px;background:var(--gold);color:#1b1424;border:0;border-radius:8px;padding:10px 18px;font:800 14px var(--f-body)}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#wrap{position:fixed;inset:0}
#slots{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:6;padding:10px}body.slots #slots{display:flex}
#slots .sp{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:rgba(14,10,30,.94);border:1.5px solid var(--gold);border-radius:12px;padding:12px 14px;gap:8px;user-select:none}

#slotList{overflow-y:auto;display:flex;flex-direction:column;gap:7px;min-height:0;padding-right:2px}
.slot{border:1.5px solid rgba(255,255,255,.14);border-radius:9px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:rgba(255,255,255,.03);cursor:pointer}
.slot.cur{border-color:var(--gold);background:rgba(255,211,77,.09)}.slot.sel{outline:2px solid #7fd3ff;outline-offset:1px}
.slot .nm{font:700 15px var(--f-display);color:#fff;display:flex;align-items:center;gap:8px;min-width:0}.slot .nm i{font:600 10px var(--f-body);font-style:normal;color:#8f88b5}
.slot .st{grid-column:1/2;font-size:11.5px;color:#e8e2ff;line-height:1.5}.slot .st .fate{font-style:italic;color:#cfc8ee;letter-spacing:.05em}.slot .st small{font-size:10.5px;color:#9fe8b0}.slot .st em{font-style:normal;color:var(--gold);font-weight:800}
.slot .bt{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:5px}
.slot button,#slots .sf button{font:700 12px var(--f-body);color:#fff;background:#2a2640;border:1.5px solid rgba(255,211,77,.6);border-radius:7px;padding:5px 12px;cursor:pointer;min-width:74px}
.slot button.play{background:var(--gold);color:#1a1408;border-color:var(--gold)}.slot button.del.warn{background:#c8202a;border-color:#ff6a6a}
.slot input{font:700 14px var(--f-display);background:#0e0a1e;color:#fff;border:1.5px solid var(--gold);border-radius:6px;padding:3px 7px;width:150px;user-select:text;-webkit-user-select:text}
#slots .sf{display:flex;gap:8px;justify-content:center}
#wrap.rot{inset:auto;top:0;left:0;transform-origin:0 0}
@media (prefers-reduced-motion:reduce){#rotate .ph{animation:none;transform:rotate(90deg)}}
#touch button{pointer-events:auto;position:absolute;opacity:.8;background:var(--btn);border:1.5px solid var(--btn-line);color:var(--ink);
  font:800 13px var(--f-body);border-radius:50%;width:62px;height:62px;touch-action:none;-webkit-tap-highlight-color:transparent}
#touch button.on{background:rgba(255,211,77,.35)}
#touch .l{left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#touch .r{left:calc(86px + env(safe-area-inset-left,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
#touch .jump{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:70px;height:70px}
#touch .shoot{right:calc(92px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px))}
#touch .dash{right:calc(28px + env(safe-area-inset-right,0px));bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#touch .nova{right:calc(100px + env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));font-size:11px}
#touch .pause{right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:8px}
body.uihide #joy,body.uihide #touch button[data-k]:not(.pause){display:none!important}
#touch .sk{width:44px;height:44px;font-size:12px;border-color:rgba(107,227,255,.6)}
#touch .s1{right:calc(150px + env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px))}
#touch .s2{right:calc(98px + env(safe-area-inset-right,0px));bottom:calc(158px + env(safe-area-inset-bottom,0px))}
#touch .s3{right:calc(46px + env(safe-area-inset-right,0px));bottom:calc(166px + env(safe-area-inset-bottom,0px))}
#touch .guard{right:calc(160px + env(safe-area-inset-right,0px));bottom:calc(60px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:12px}
#joy{position:absolute;left:0;top:28%;bottom:0;width:40%;pointer-events:auto;touch-action:none}
#joy .base{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid var(--btn-line);background:radial-gradient(circle,rgba(20,18,36,.15),rgba(20,18,36,.55));left:calc(84px + env(safe-area-inset-left,0px));top:calc(100% - 84px - env(safe-area-inset-bottom,0px));opacity:.75}
#joy .knob{position:absolute;width:50px;height:50px;left:31px;top:31px;border-radius:50%;background:rgba(255,211,77,.55);border:2px solid rgba(255,255,255,.5)}
#joy.on .base{opacity:1}
#touch .fs.cfg{right:calc(156px + env(safe-area-inset-right,0px))}
#tedit{display:none;position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);pointer-events:auto;background:rgba(14,12,28,.92);border:1.5px solid #ffd34d;border-radius:12px;padding:8px 12px;color:#fff;font:12px "Be Vietnam Pro",system-ui,sans-serif;width:min(300px,70%);flex-direction:column;gap:5px;z-index:5}

#tedit .row{display:flex;gap:8px;justify-content:center}#tedit .row button{position:static;pointer-events:auto;opacity:1;width:auto;height:auto;padding:6px 14px;border-radius:8px;background:#2a2640;color:#fff;border:1.5px solid #ffd34d;font:600 12px "Be Vietnam Pro",system-ui,sans-serif}#tedit #teDone{background:#ffd34d;color:#1a1408}

   st.innerHTML=!v.introSeen&&!S.fr&&!S.ph?`<i class="fate">Định mệnh vẫy gọi......</i>`:t1+(S.ph>=12?t2:"")+(S.nh>=5?t3:"")}
  const bt=document.createElement("div");bt.className="bt";const mk=(t,c,f)=>{const b=document.createElement("button");b.type="button";b.textContent=t;if(c)b.className=c;b.onclick=ev=>{ev.stopPropagation();f(b)};bt.appendChild(b)};

function newSlot(){let n=META.list.length+1;while(META.list.some(q=>q.name==="ACC"+n))n++;const id="s"+Date.now().toString(36);META.list.push({id,name:"ACC"+n,t:0});try{localStorage.setItem(slotKey(id),JSON.stringify(freshSave()))}catch(e){}saveMeta();SLOTSEL=META.list.length-1;renderSlots(id)}
function delSlot(id){const i=META.list.findIndex(q=>q.id===id);if(i<0||META.list.length<2)return;META.list.splice(i,1);try{localStorage.removeItem(slotKey(id))}catch(e){}if(META.cur===id){META.cur=META.list[0].id;save=loadSave(META.cur)}saveMeta();SLOTSEL=Math.min(SLOTSEL,META.list.length-1);renderSlots()}
